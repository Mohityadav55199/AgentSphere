name: Keep Server Warm (Render Free Tier)

on:
  schedule:
    # Runs every 14 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional custom URL to ping (defaults to RENDER_APP_URL secret)'
        required: false
        type: string

jobs:
  ping-health:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine Target URL
        id: resolve-url
        run: |
          # Priority: Manual input -> RENDER_APP_URL secret -> NEXT_PUBLIC_APP_URL secret -> APP_URL secret
          TARGET="${{ inputs.target_url || secrets.RENDER_APP_URL || secrets.NEXT_PUBLIC_APP_URL || secrets.APP_URL }}"
          
          if [ -z "$TARGET" ]; then
            echo "::error::Target URL is not configured! Please configure RENDER_APP_URL in your repository Secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          # Strip trailing slash if present
          TARGET="${TARGET%/}"

          # Ensure /api/health path is targeted
          if [[ "$TARGET" != *"/api/health" ]]; then
            TARGET="${TARGET}/api/health"
          fi

          echo "target_url=$TARGET" >> $GITHUB_OUTPUT
          echo "Pinging: $TARGET"

      - name: Ping Keep-Alive Endpoint
        id: ping
        run: |
          URL="${{ steps.resolve-url.outputs.target_url }}"
          echo "Sending keep-alive request to $URL at $(date -u)..."
          
          START_TIME=$(date +%s%3N)
          HTTP_RESPONSE=$(curl -s -S -o response.json -w "%{http_code}" --max-time 60 "$URL" || echo "FAILED")
          END_TIME=$(date +%s%3N)
          DURATION=$((END_TIME - START_TIME))

          echo "Response code: $HTTP_RESPONSE"
          echo "Duration: ${DURATION}ms"
          cat response.json 2>/dev/null || echo "(no json response)"
          echo ""

          if [ "$HTTP_RESPONSE" = "200" ]; then
            echo "✅ Server responded with HTTP 200 (warm). Total time: ${DURATION}ms"
            STATUS="warm"
          elif [ "$HTTP_RESPONSE" = "502" ] || [ "$HTTP_RESPONSE" = "503" ] || [ "$HTTP_RESPONSE" = "504" ] || [ "$HTTP_RESPONSE" = "FAILED" ]; then
            echo "⚡ Server appears to have been asleep or cold-starting. Waiting 20 seconds for wake-up..."
            sleep 20
            
            RETRY_START=$(date +%s%3N)
            RETRY_CODE=$(curl -s -S -o response_retry.json -w "%{http_code}" --max-time 60 "$URL" || echo "FAILED")
            RETRY_END=$(date +%s%3N)
            RETRY_DURATION=$((RETRY_END - RETRY_START))
            
            echo "Retry response code: $RETRY_CODE"
            cat response_retry.json 2>/dev/null || true
            
            if [ "$RETRY_CODE" = "200" ]; then
              echo "✅ Server successfully woke up on retry!"
              STATUS="woken_up"
            else
              echo "⚠️ Server wake-up triggered, but status returned: $RETRY_CODE"
              STATUS="waking"
            fi
          else
            echo "Received status $HTTP_RESPONSE from $URL"
            STATUS="received_$HTTP_RESPONSE"
          fi

          # Generate GitHub Job Summary
          echo "### 🌐 Render Keep-Alive Ping Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Target URL**: \`$URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP Code**: $HTTP_RESPONSE" >> $GITHUB_STEP_SUMMARY
          echo "- **Initial Response Duration**: ${DURATION}ms" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
