services:
  - type: web
    name: agentsphere
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Required in production: signs session cookies. Render generates a random value once.
      - key: JWT_SECRET
        generateValue: true
      # Keep stdio MCP servers (arbitrary shell commands) disabled on the public demo.
      - key: MCP_ALLOW_STDIO
        value: "false"
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
